# yaml
services:
  identity.server:
    image: ${DOCKER_REGISTRY-}identityservice
    build:
      context: ../../
      dockerfile: src/IdentityService/IdentityService.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=identity-db;Port=5432;Database=IdentityService;Username=postgres;Password=postgres
    ports:
      - "5001:8080"
    depends_on:
        - identity-db
    env_file:
      - ../../.env
    restart: always

  identity-db:
    image: postgres:16
    environment:
      POSTGRES_DB: IdentityService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  identity-db-data:
    external: true