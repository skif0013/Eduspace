services:
  quizservice.webapi:
    image: quizservice.webapi
    build:
      context: ..
      dockerfile: QuizService/QuizService.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=quiz-db;Port=5432;Database=quizdb;Username=postgres;Password=postgres
    depends_on:
      - quiz-db

  quiz-db:
    image: postgres:16
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - quiz-db-data:/var/lib/postgresql/data

volumes:
  quiz-db-data:
    external: true