services:

  

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-identity
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=identity-db;Port=5432;Database=IdentityService;Username=postgres;Password=postgres
      - RedisEndPoint=redis:6379
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
        - .env
    restart: always
    networks:
      - eduspace-net

  identity-db:
    image: postgres:16
    environment:
      POSTGRES_DB: IdentityService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d IdentityService"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - eduspace-net

  course-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-course
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=course-db;Port=5432;Database=CourseDB;Username=postgres;Password=postgres
      - RedisEndPoint=redis:6379
    depends_on:
      course-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    networks:
      - eduspace-net

  course-db:
    image: postgres:16
    environment:
      POSTGRES_DB: CourseDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - course-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CourseDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - eduspace-net

  quiz-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-quiz
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=quiz-db;Port=5432;Database=quizdb;Username=postgres;Password=postgres
      - Redis__Endpoint=redis:6379
    depends_on:
      quiz-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - eduspace-net

  quiz-db:
    image: postgres:16
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - quiz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quizdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - eduspace-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-notification
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RedisEndPoint=redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - eduspace-net

  file-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-file
    ports:
      - "5005:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=file-db;Port=5432;Database=FileDB;Username=postgres;Password=postgres
    env_file:
      - .env
    depends_on:
      file-db:
        condition: service_healthy
    restart: always
    networks:
      - eduspace-net

  file-db:
    image: postgres:16
    environment:
      POSTGRES_DB: FileDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - file-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FileDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - eduspace-net
      

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - eduspace-net

networks:
  eduspace-net:
    driver: bridge

volumes:
  identity-db-data:
    driver: local
  course-db-data:
    driver: local
  file-db-data:
    driver: local
  quiz-db-data:
    driver: local
  redis-data:
  
